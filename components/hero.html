<!-- HERO -->
<header
  class="pt-24 min-h-screen flex items-center text-white hero-bg relative"
>
  <div class="max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-12 items-center">
    <!-- RIGHT SIDE (NOW TOP ON MOBILE) -->
    <div class="flex justify-center md:justify-end order-1 md:order-2">
      <div class="relative">
        <!-- Background Shape -->
        <div
          class="w-72 h-72 md:w-96 md:h-96 bg-gradient-to-br from-[#0A66C2]/30 to-transparent rounded-[4rem] rotate-12 shadow-2xl"
        ></div>

        <!-- Image -->
        <div class="absolute inset-0 flex items-center justify-center">
          <img
            src="images/jebe1.jpg"
            alt="Jessey Profile Photo"
            class="w-64 h-64 md:w-80 md:h-80 object-cover rounded-2xl shadow-xl border border-white/10"
          />
        </div>

        <!-- Badge 1 -->
        <div
          class="absolute -top-2 md:-top-6 -left-4 md:-top-6 md:-left-6 bg-white text-zinc-950 text-xs md:text-sm px-4 md:px-6 py-2 md:py-3 rounded-3xl shadow-2xl flex items-center gap-2 -rotate-6 md:-rotate-12"
        >
          <i class="fa-solid fa-medal text-amber-500"></i>
          <span class="font-semibold">IBM Certified</span>
        </div>

        <!-- Badge 2 -->
        <div
          class="absolute -bottom-6 right-4 md:-bottom-8 md:right-8 bg-white text-zinc-950 text-xs md:text-sm px-4 md:px-6 py-2 md:py-3 rounded-3xl shadow-2xl flex items-center gap-2 rotate-6 md:rotate-12"
        >
          <i class="fa-solid fa-certificate"></i>
          <span class="font-semibold">Software Developer</span>
        </div>
      </div>
    </div>

    <!-- LEFT SIDE -->
    <div class="space-y-8 order-2 md:order-1 text-center md:text-left">
      <h1
        class="heading-font text-5xl md:text-8xl font-semibold tracking-tighter leading-none"
      >
        Hi, I'm Jessey<span class="text-[#0A66C2]">,</span>
      </h1>

      <p class="text-xl md:text-2xl text-white/90 max-w-lg mx-auto md:mx-0">
        I solve problems through smart, reliable software.
      </p>

      <div
        class="hidden md:flex flex-wrap justify-center md:justify-start items-center gap-5"
      >
        <a
          href="#projects"
          class="px-8 md:px-10 py-4 md:py-5 bg-white text-zinc-950 rounded-3xl font-semibold text-base md:text-lg flex items-center gap-3 hover:shadow-2xl hover:scale-105 transition-all"
        >
          My Work in Action
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
      <div
        class="flex md:hidden flex-col items-center gap-2 text-white/70 mt-8"
      >
        <p class="text-xs uppercase tracking-[2px]">Scroll for magic</p>

        <i class="fa-solid fa-chevron-down animate-bounce text-2xl"></i>
      </div>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div
    class="hidden md:flex absolute bottom-12 left-1/2 flex-col items-center gap-2 text-white/70 -translate-x-1/2"
  >
    <p class="text-xs uppercase tracking-[2px]">Scroll for magic</p>

    <i class="fa-solid fa-chevron-down animate-bounce text-2xl"></i>
  </div>
</header>
